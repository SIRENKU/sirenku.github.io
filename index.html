<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SI-Tukin Bawaslu</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#C8102E"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SI-Tukin"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--r:#D8112A;--rd:#A30D21;--g:#F2B21B;--gl:#FFF3D1;--bg:#F7F8FB;--ink:#1F2430;--line:#E9ECF2;--mut:#6B7385;--sh:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.06)}
*{box-sizing:border-box}
body{margin:0;font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
header{background:linear-gradient(120deg,#E3162E 0%,#B80E24 100%);color:#fff;padding:10px 22px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:3px solid var(--g)}
header .lg{width:32px;height:32px;border-radius:9px;background:#fff;padding:2px;object-fit:contain}
header b{font-size:16px;letter-spacing:.5px;font-weight:800}
header small{background:rgba(255,255,255,.18);padding:2px 11px;border-radius:99px;font-size:12px}
header .sp{flex:1}
header .tag{background:#fff;color:var(--rd)}
header .b.g{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.4);box-shadow:none}
header .b.g:hover{background:rgba(255,255,255,.28)}
nav{position:sticky;top:0;z-index:20;display:flex;gap:6px;align-items:center;padding:8px 16px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:8px 14px;border-radius:999px;cursor:pointer;color:var(--mut);font:600 13.5px inherit;transition:.15s;flex:none}
nav button .ic{display:grid;place-items:center;width:18px;height:18px}
nav{border-bottom:2px solid transparent;border-image:linear-gradient(90deg,var(--r),var(--g),var(--r)) 1;box-shadow:0 2px 14px rgba(216,17,42,.28),0 1px 22px rgba(242,178,27,.22)}
nav button{border:1px solid transparent;flex-direction:row}
nav button:hover:not(.on){background:#FFF0F2;color:var(--r);border-color:rgba(216,17,42,.55);text-shadow:0 0 8px rgba(216,17,42,.55);box-shadow:0 0 10px rgba(216,17,42,.4),inset 0 0 8px rgba(216,17,42,.12)}
nav button.on{background:var(--r);color:#fff;border-color:rgba(255,255,255,.75);text-shadow:0 0 6px rgba(255,255,255,.95),0 0 12px rgba(255,214,120,.8);box-shadow:0 0 6px rgba(255,70,95,.95),0 0 16px rgba(216,17,42,.75),0 0 30px rgba(242,178,27,.45),inset 0 0 10px rgba(255,255,255,.28);animation:neon 2.6s ease-in-out infinite}
@keyframes neon{0%,100%{box-shadow:0 0 6px rgba(255,70,95,.95),0 0 16px rgba(216,17,42,.75),0 0 30px rgba(242,178,27,.45),inset 0 0 10px rgba(255,255,255,.28)}50%{box-shadow:0 0 9px rgba(255,90,115,1),0 0 22px rgba(216,17,42,.9),0 0 40px rgba(242,178,27,.6),inset 0 0 12px rgba(255,255,255,.4)}}
@media(prefers-reduced-motion:reduce){nav button.on{animation:none}}
nav select{flex:none;border-radius:999px;padding:7px 12px}
main{padding:22px;max-width:1300px;margin:auto}
h2{position:relative;margin:2px 0 18px;padding-bottom:10px;color:var(--ink);font-size:21px;font-weight:800;letter-spacing:-.3px}
h2::after{content:"";position:absolute;left:0;bottom:0;width:36px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--r),var(--g))}
h3{margin:0 0 8px;font-size:15.5px;color:var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.stat{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--sh);color:var(--mut);font-weight:600}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--r),var(--g))}
.stat b{display:block;font-size:30px;line-height:1.15;color:var(--r);font-weight:800}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th{background:#FFF5F6;color:var(--rd);text-align:left;padding:10px;position:sticky;top:0;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid #F7D5DA;white-space:nowrap;z-index:1}
td{padding:9px 10px;border-bottom:1px solid #F0F2F6;vertical-align:top}
tbody tr:hover td,table tr:hover td{background:#FFFBFB}
tr.off td{background:#F6F7F9;color:#9AA1B0}
.tw{overflow:auto;max-height:72vh;border-radius:12px}
.b,button.b{display:inline-block;background:var(--r);color:#fff;border:0;padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13.5px;box-shadow:0 2px 6px rgba(216,17,42,.25);transition:.15s}
.b:hover{background:#C20F25;transform:translateY(-1px)}.b:active{transform:none}.b:disabled{opacity:.5;cursor:default;transform:none}
.b.g{background:var(--gl);color:#7A5200;border:1px solid #F3DA9B;box-shadow:none}
.b.g:hover{background:#FFEAB0}
.b.s{padding:4px 11px;font-size:12px;border-radius:8px}
input,select,textarea{padding:9px 11px;border:1px solid #DDE1E9;border-radius:10px;font:inherit;width:100%;background:#fff;color:var(--ink);transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--r);box-shadow:0 0 0 3px rgba(216,17,42,.12)}
input:disabled{background:#F3F4F7;color:#9AA1B0}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.bar input,.bar select{width:auto}
dialog{border:0;border-radius:20px;padding:22px;width:min(600px,94vw);max-height:90vh;overflow:auto;box-shadow:0 24px 70px rgba(16,24,40,.3)}
dialog::backdrop{background:rgba(20,16,24,.5);backdrop-filter:blur(2px)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{font-size:12px;color:var(--mut);font-weight:600}.f .w{grid-column:1/-1}
.login{max-width:390px;margin:9vh auto;border-top:4px solid var(--r)}
.warn{color:var(--r);font-weight:700}
.tag{background:var(--gl);color:#7A5200;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600}
a{color:var(--r)}
@media(max-width:700px){.grid{grid-template-columns:1fr 1fr;gap:10px}.stat{padding:12px 14px}.stat b{font-size:24px}main{padding:12px}header{padding:8px 12px}header b{font-size:14.5px}nav{padding:6px 8px;gap:2px}nav button{flex-direction:row;gap:6px;padding:7px 12px;border-radius:999px;font-size:12.5px}nav button .ic{width:16px;height:16px}.f{grid-template-columns:1fr}.card{padding:14px}h2{font-size:19px}table{font-size:12px}.bar input,.bar select,.bar .b{flex:1 1 140px}}

const ANG=['Darat','Laut','Udara','Darat - Laut','Darat - Udara','Laut - Udara','Darat - Laut - Udara'],
DUK=['Surat Tugas','Undangan','Memo','Nota Dinas'],DUKST=['Undangan','Nota Dinas','Memo'],

notifBanner=()=>{const t=[];if(isPeg()){const a=nSpdPeg(),b=nStPeg();if(a)t.push(a+' permintaan SPD ditolak atasan. Buka menu SPD untuk memperbaiki dan mengajukan kembali.');if(b)t.push(b+' permintaan ST ditolak atasan. Buka menu Surat Tugas untuk memperbaiki dan mengajukan kembali.');const c=nRdy();if(c)t.push(c+' dokumen (ST/SPD) sudah diunggah admin dan dapat diunduh.')}

 else if(isAts()){const a=nSpdAts(),b=nStAts();if(a)t.push(a+' permintaan SPD menunggu persetujuan Anda.');if(b)t.push(b+' permintaan ST menunggu persetujuan Anda.')}
 if(isKako()&&kabMe()){const n=Object.values(S.spkl).filter(x=>x.status=='Disetujui Atasan').length;if(n)t.push(n+' permintaan SPKL sudah disetujui Korsek dan menunggu diproses (TTE lalu unggah dokumen SPKL) di menu Lembur.')}

const stRule=(rows,jn)=>{const k=[...new Set(rows.map(r=>r.kat))];
 if(rows.some(r=>!r.kat))return{err:'Pilih kategori untuk setiap pegawai.'};
 if(jn=='Kolektif'&&rows.length<2)return{err:'ST kolektif minimal 2 orang. Pilih jenis Perorangan bila hanya 1 orang.'};
 if(k.includes('Kepala Sekretariat')){if(rows.length>1)return{err:'ST Kepala Sekretariat tidak boleh digabung dengan pegawai lain.'};return{ttd:'kasek'}}
 if(k.includes('Pimpinan (Ketua/Anggota)')){if(k.length>1)return{err:'ST Pimpinan (Ketua/Anggota Komisioner) tidak boleh digabung dengan Staf, Kabag, atau Kepala Sekretariat.'};return{ttd:'pimpinan'}}

const spdTabel=(L,aksi,extra)=>`<table><tr><th>No</th>${isSup()?'<th>Satker</th>':''}<th>Jenis</th><th>Nama / Jabatan</th><th>Perjalanan</th><th>Angkutan</th><th>Maksud</th><th>Tgl terbit SPD</th><th>Data dukung</th><th>Status</th>${extra?'<th>No. SPD</th><th>SPD</th>':''}<th></th></tr>${L.map((x,i)=>`<tr><td>${i+1}</td>${isSup()?`<td>${esc(x.satker)}</td>`:''}<td>${esc(x.jenis)}</td><td>${nmList(x)}</td><td>${tglID(x.tglBerangkat)} s.d. ${tglID(x.tglKembali)}<br><small>${x.lama} hari</small><br>${esc(x.asal)} → ${esc(x.tujuan)}</td><td>${esc(x.angkutan)}</td><td>${esc(x.maksud)}</td><td>${tglID(x.tglTerbit)}</td><td>${x.dukung?lnkB(x,'',x.jenisDukung||'unduh'):''}</td><td>${stt(x.status)}${x.atasanJab?'<br><small>Penyetuju: <b>'+esc(x.atasanJab)+'</b></small>':''}${x.atasan&&x.status!='Draft'&&x.status!='Diajukan'?`<br><small>atasan: ${esc(x.atasan)}</small>`:''}${alsn(x)}</td>${extra?`<td>${esc(x.no||'')}</td><td>${x.hasil?lnkB(x,'hasil',x.hasil):'<span class="warn">belum</span>'}</td>`:''}<td style="white-space:nowrap">${aksi(x)}</td></tr>`).join('')||`<tr><td colspan="14">Belum ada data.</td></tr>`}</table>`;
const spdPeg=()=>`<h2>SPD — Surat Perjalanan Dinas</h2><div class="card"><p style="font-size:13px">Ajukan permintaan penerbitan SPD (perorangan atau fullboard). Setelah data dan data dukung (ST/Undangan/Memo/Nota Dinas) tersimpan, tekan <b>Kirim</b> agar atasan memeriksa. Setelah disetujui, Admin STSPD menerbitkan SPD dan Anda dapat mengunduhnya di tabel bawah.</p><button class="b" onclick="F.spdForm()">+ Buat permintaan SPD</button></div><div class="card tw">${spdTabel(mine(S.spd),x=>`${x.status=='Draft'&&x.dukung?`<button class="b s" onclick="F.spdKirim('${x.id}')">Kirim</button> `:''}${['Draft','Ditolak'].includes(x.status)?`<button class="b s g" onclick="F.spdForm('${x.id}')">${x.status=='Ditolak'?'Perbaiki':'Edit'}</button> `:''}${['Draft','Ditolak','Diajukan'].includes(x.status)?`<button class="b s g" onclick="F.spdDel('${x.id}')">${x.status=='Diajukan'?'Batalkan & hapus':'Hapus'}</button>`:''}`,1)}</div>`;
const spdAts=()=>{const L=Object.values(S.spd).filter(x=>x.satker==S.me.satker&&x.status!='Draft'&&matchAts(x)).sort((a,b)=>((a.status=='Diajukan'?0:1)-(b.status=='Diajukan'?0:1))||(b.at||'').localeCompare(a.at||''));
 return`<h2>SPD — Persetujuan (Atasan)</h2><div class="card tw"><p style="font-size:12px">Periksa data dan data dukung, lalu setujui atau tolak permintaan SPD pegawai${S.me.bag?' pada Bagian <b>'+esc(S.me.bag)+'</b>':''}. Bila disetujui, Admin STSPD diberi tahu untuk membuat SPD. Bila ditolak, pegawai diberi tahu dan dapat memperbaiki lalu mengajukan kembali.</p>${spdTabel(L,x=>x.status=='Diajukan'?`<button class="b s" onclick="F.spdOk('${x.id}')">Setujui</button> <button class="b s g" onclick="F.spdNo('${x.id}')">Tolak</button>`:'',1)}</div>`};
const spdAdm=()=>{const q=S.q.spd,t=(q.t||'').toLowerCase(),L=Object.values(S.spd).filter(x=>fsat(x)&&['Disetujui Atasan','Selesai'].includes(x.status)&&(!q.s||x.status==q.s)&&(!q.a||x.atasanJab==q.a)&&(!t||JSON.stringify([x.pegawai,x.tujuan,x.asal,x.no,x.maksud]).toLowerCase().includes(t))).sort((a,b)=>((a.status=='Disetujui Atasan'?0:1)-(b.status=='Disetujui Atasan'?0:1))||(b.at||'').localeCompare(a.at||''));
 return`<h2>SPD — Rekap & Penerbitan (${isKako()?'Admin Kako':'Admin STSPD'})</h2>${isKako()?kakoTop('spd'):''}<div class="bar">${atsFilter('spd')}<select onchange="S.q.spd.s=this.value;F.dr()"><option value="">Semua status</option>${['Disetujui Atasan','Selesai'].map(s=>`<option ${s==q.s?'selected':''}>${s}</option>`).join('')}</select><input placeholder="Cari nama / tujuan / nomor" value="${esc(q.t)}" onchange="S.q.spd.t=this.value;F.dr()"><button class="b g" onclick="F.xt()">Unduh Excel</button></div><div class="card tw"><p style="font-size:12px">Rekap permintaan SPD yang sudah disetujui atasan dan SPD yang sudah diunggah. Yang berstatus <b>Disetujui Atasan</b> menunggu SPD Anda terbitkan: tekan <b>Unggah SPD</b>.</p>${spdTabel(L,x=>`<button class="b s" onclick="F.spdUp('${x.id}')">${x.hasil?'Ganti SPD':'Unggah SPD'}</button> <button class="b s g" onclick="F.spdDel('${x.id}')">Hapus</button>`,1)}</div>${isKako()?kakoList('spd'):''}`};

const stPeg=()=>`<h2>ST — Surat Tugas</h2><div class="card"><p style="font-size:13px">Ajukan permintaan pembuatan Surat Tugas (perorangan atau kolektif). Wajib mengunggah salah satu data dukung (<b>Undangan / Nota Dinas / Memo</b>) yang memuat <b>nomor dan tanggal</b> serta <b>uraian/maksud melaksanakan tugas</b>. Setelah data tersimpan, tekan <b>Kirim</b> agar atasan menyetujui; ST yang sudah ditandatangani (TTE) dan diunggah Admin STSPD dapat diunduh di tabel bawah.</p><button class="b" onclick="F.stForm()">+ Buat permintaan ST</button></div><div class="card tw">${stTabel(mine(S.st),x=>`${x.status=='Draft'&&x.dukung?`<button class="b s" onclick="F.stKirim('${x.id}')">Kirim</button> `:''}${['Draft','Ditolak'].includes(x.status)?`<button class="b s g" onclick="F.stForm('${x.id}')">${x.status=='Ditolak'?'Perbaiki':'Edit'}</button> `:''}${['Draft','Ditolak','Diajukan'].includes(x.status)?`<button class="b s g" onclick="F.stDel('${x.id}')">${x.status=='Diajukan'?'Batalkan & hapus':'Hapus'}</button>`:''}`)}</div>`;
const stAts=()=>{const L=Object.values(S.st).filter(x=>x.satker==S.me.satker&&x.status!='Draft'&&matchAts(x)).sort((a,b)=>((a.status=='Diajukan'?0:1)-(b.status=='Diajukan'?0:1))||(b.at||'').localeCompare(a.at||''));
 return`<h2>ST — Persetujuan (Atasan)</h2><div class="card tw"><p style="font-size:12px">Periksa data dan data dukung (harus memuat nomor, tanggal, dan uraian tugas), lalu setujui atau tolak permintaan ST${S.me.bag?' pada Bagian <b>'+esc(S.me.bag)+'</b>':''}. Bila disetujui, permintaan masuk ke rekap Admin STSPD. Bila ditolak, pegawai dapat memperbaiki dan mengajukan kembali.</p>${stTabel(L,x=>x.status=='Diajukan'?`<button class="b s" onclick="F.stOk('${x.id}')">Setujui</button> <button class="b s g" onclick="F.stNo('${x.id}')">Tolak</button>`:'')}</div>`};
const dipaOf=()=>S.dipa[skey().replace(/\W+/g,'_')]||{};
const stAdm=()=>{const q=S.q.st,t=(q.t||'').toLowerCase(),dp=dipaOf(),L=Object.values(S.st).filter(x=>fsat(x)&&['Disetujui Atasan','Selesai'].includes(x.status)&&(!q.s||x.status==q.s)&&(!q.a||x.atasanJab==q.a)&&(!t||JSON.stringify([x.pegawai,x.uraian,x.noDukung,x.no]).toLowerCase().includes(t))).sort((a,b)=>((a.status=='Disetujui Atasan'?0:1)-(b.status=='Disetujui Atasan'?0:1))||(b.at||'').localeCompare(a.at||''));
 return`<h2>ST — Rekap & Penerbitan (${isKako()?'Admin Kako':'Admin STSPD'})</h2>${isKako()?kakoTop('st'):''}<div class="card"><h3>Data DIPA untuk Template ST — ${esc(skey())}</h3><p style="font-size:12px">Perbarui secara rutin setiap ada perubahan DIPA. Data ini dipakai pada template ST.</p><div class="f">${E(['dp_no','Nomor DIPA','text'],{v:dp.no})}${E(['dp_tg','Tanggal DIPA','date'],{v:dp.tgl})}${E(['dp_rv','Revisi ke- (angka, mis. 6)','text'],{v:dp.rev,w:1})}</div><p style="font-size:12px">${dp.no?'Saat ini: <b>'+esc(dp.no)+'</b>'+(dp.rev?', Revisi Ke-'+esc(dp.rev):'')+', tanggal '+tglID(dp.tgl)+(dp.by?' (diperbarui '+esc(dp.by)+', '+tglID((dp.at||'').slice(0,10))+')':''):'<span class="warn">Data DIPA belum diisi.</span>'}</p><button class="b" onclick="F.dipaSave()">Simpan data DIPA</button></div>
<div class="card"><h3>Penandatangan ST — ${esc(skey())}</h3><p style="font-size:12px">Nama dan jabatan ini otomatis dipakai pada setiap ST yang dibuat berikutnya. Ubah di sini bila penandatangan berganti (mis. Plt.). ST yang sudah dibuat/diunggah tidak berubah.</p><div class="f">${E(['st_kj','Jabatan penandatangan (mis. Plt. Kepala Sekretariat)','text'],{v:(S.set||{}).kep_jab})}${E(['st_kn','Nama penandatangan','text'],{v:(S.set||{}).kep_nama})}</div>${kabMe()?`<div class="f">${E(['st_kj2','Jabatan Ketua (penandatangan ST Pimpinan Komisioner)','text'],{v:(S.set||{}).ket_jab})}${E(['st_kn2','Nama Ketua','text'],{v:(S.set||{}).ket_nama})}</div><p style="font-size:12px">Di kab/kota: penandatangan ST Staf, Kassubag, dan Korsek adalah <b>Korsek</b> (isian di atas); ST Pimpinan Komisioner ditandatangani <b>Ketua</b>.</p>`:''}<p style="font-size:12px">${(S.set||{}).kep_nama?'Saat ini: <b>'+esc(S.set.kep_nama)+'</b>, '+esc((S.set||{}).kep_jab||''):'<span class="warn">Penandatangan belum diisi.</span>'}</p><button class="b" onclick="F.stTtdSave()">Simpan penandatangan</button></div>
<div class="bar">${atsFilter('st')}<select onchange="S.q.st.s=this.value;F.dr()"><option value="">Semua status</option>${['Disetujui Atasan','Selesai'].map(s=>`<option ${s==q.s?'selected':''}>${s}</option>`).join('')}</select><input placeholder="Cari nama / uraian / nomor" value="${esc(q.t)}" onchange="S.q.st.t=this.value;F.dr()"><button class="b g" onclick="F.xt()">Unduh Excel</button></div><div class="card tw"><p style="font-size:12px">Rekap permintaan ST yang sudah disetujui atasan dan ST yang sudah diunggah. Buat ST sesuai template, tandatangani (TTE), lalu unggah dengan <b>Unggah ST</b>. Pegawai otomatis diberi tahu bahwa ST dapat diunduh.</p>${stTabel(L,x=>`<button class="b s g" onclick="F.stDoc('${x.id}')">Buat ST</button> <button class="b s" onclick="F.stUp('${x.id}')">${x.hasil?'Ganti ST':'Unggah ST'}</button> <button class="b s g" onclick="F.stDel('${x.id}')">Hapus</button>`)}</div>${isKako()?kakoList('st'):''}`};
const vST=()=>isPeg()?stPeg():isAts()?stAts():stAdm();
const aksiPeg=c=>x=>`${x.status=='Draft'&&x.dukung?`<button class="b s" onclick="F.${c}Kirim('${x.id}')">Kirim</button> `:''}${['Draft','Ditolak'].includes(x.status)?`<button class="b s g" onclick="F.${c}Form('${x.id}')">${x.status=='Ditolak'?'Perbaiki':'Edit'}</button> `:''}${['Draft','Ditolak','Diajukan'].includes(x.status)?`<button class="b s g" onclick="F.${c}Del('${x.id}')">${x.status=='Diajukan'?'Batalkan & hapus':'Hapus'}</button>`:''}`;
const kakoTop=c=>`<div class="card" style="border-left:4px solid var(--g)"><h3>Ajukan ${c=='st'?'Surat Tugas':'SPD'} atas nama pegawai</h3><p style="font-size:12px">Di kabupaten/kota, pengajuan dilakukan melalui Admin Kako. Alur: Kirim → Korsek/Ketua diberi tahu lewat WhatsApp → setelah disetujui muncul pemberitahuan di sini → proses TTE lalu unggah ${c=='st'?'ST':'SPD'} → pemohon diberi tahu.<br>Atasan penyetuju: ${c=='st'?'ST Staf, Kassubag, dan Korsek disetujui <b>Korsek</b>; ST Pimpinan Komisioner disetujui <b>Ketua</b>.':'SPD Staf dan Kassubag disetujui <b>Korsek</b>; SPD Korsek, Pimpinan Komisioner, dan Ketua disetujui <b>Ketua</b>.'}</p><button class="b" onclick="F.${c}Form()">+ Buat permintaan ${c=='st'?'ST':'SPD'}</button></div>`;
const kakoList=c=>`<div class="card tw"><h3>Pengajuan yang saya buat (Draft / menunggu atasan / ditolak)</h3>${c=='st'?stTabel(mine(S.st),aksiPeg('st')):spdTabel(mine(S.spd),aksiPeg('spd'),1)}</div>`;

Object.assign(F,{
 // --- baris peserta ---

 pRowDel(i){const r=pRead();r.splice(i,1);pDraw(r);if(S.fm.kat)F.stHint()},
 // --- berkas ---

 // --- SPD: pegawai ---

  dlg(`<h3>${o?(o.status=='Ditolak'?'Perbaiki':'Edit'):'Buat'} Permintaan SPD</h3>${o&&o.alasan?`<p class="warn" style="font-size:13px">Alasan penolakan atasan: ${esc(o.alasan)}</p>`:''}${pemSel(o)}<div class="f">${E(['spd_jn','Jenis SPD','sel',['Perorangan','Fullboard'],'onchange="F.spdJenis()"'],{v:o&&o.jenis,w:1})}</div><p style="font-size:12px;margin:6px 0">Perorangan: satu nama. Fullboard: boleh lebih dari satu nama, diajukan dari satu akun pegawai saja.</p><div id="prows"></div>
<div class="f">${E(['spd_tb','Tanggal berangkat','date','onchange="F.spdLama()"'],{v:o&&o.tglBerangkat})}${E(['spd_tk','Tanggal kembali','date','onchange="F.spdLama()"'],{v:o&&o.tglKembali})}<div class="w" id="spd_lama" style="font-size:13px;color:var(--mut)"></div>${E(['spd_as','Tempat berangkat','text'],{v:o&&o.asal})}${E(['spd_tj','Tempat tujuan','text'],{v:o&&o.tujuan})}${E(['spd_ag','Angkutan','sel',ANG],{v:o&&o.angkutan})}${kabMe()?'<div class="w" id="spd_ats" style="font-size:13px;color:var(--mut)"></div>':E(['spd_bg','Bagian (menentukan atasan penyetuju)','sel',bagList()],{v:o&&o.bagian})}${E(['spd_tt','Tanggal diterbitkannya SPD','date'],{v:(o&&o.tglTerbit)||today})}${E(['spd_jd','Jenis data dukung','sel',DUK],{v:o&&o.jenisDukung})}<label class="w">Maksud perjalanan dinas<textarea id="f_spd_mk" rows="3">${esc(o?o.maksud:'')}</textarea></label><label class="w">Data dukung (ST / Undangan / Memo / Nota Dinas) — gambar/PDF ≤700KB${o&&o.dukung?'<br><small>File saat ini: '+esc(o.dukung)+' (kosongkan bila tidak diganti)</small>':''}<input type="file" id="f_spd_df" accept="image/*,application/pdf"></label></div><p><button class="b" onclick="F.spdSave('${id||''}')">Simpan</button></p>`);
  pDraw(o?o.pegawai:[{nama:meNm(),jab:meJb(),kat:''}]);F.spdLama();F.spdAts()},
 spdJenis(){S.fm.multi=f('spd_jn')=='Fullboard';let r=pRead();if(!S.fm.multi)r=r.slice(0,1);pDraw(r)},
 spdLama(){const a=f('spd_tb'),b=f('spd_tk'),n=lamaHr(a,b);$('#spd_lama').textContent=a&&b?(n>0?'Lama perjalanan dinas: '+n+' hari':'Tanggal kembali tidak boleh sebelum tanggal berangkat'):''},
 async spdSave(id){const rows=pRead(),jn=f('spd_jn'),d={jenis:jn,pegawai:rows,tglBerangkat:f('spd_tb'),tglKembali:f('spd_tk'),asal:(f('spd_as')||'').trim(),tujuan:(f('spd_tj')||'').trim(),angkutan:f('spd_ag'),bagian:f('spd_bg')||'-',...pemFields(),atasanJab:kabMe()?atsOfSPD(rows):'',tglTerbit:f('spd_tt'),jenisDukung:f('spd_jd'),maksud:(f('spd_mk')||'').trim()};
  if(isKako()&&!f('pem_u'))return alert('Pilih pegawai pemohon terlebih dahulu.');if(kabMe()&&rows.some(p=>!p.kat))return alert('Pilih jabatan pemohon untuk setiap nama.');if(!rows.length||rows.some(p=>!p.nama||!p.jab))return alert('Lengkapi nama dan jabatan/bagian/instansi setiap pegawai.');if(jn=='Perorangan'&&rows.length>1)return alert('SPD perorangan hanya untuk satu nama.');
  if(!d.tglBerangkat||!d.tglKembali||!d.asal||!d.tujuan||!d.angkutan||!d.bagian||!d.tglTerbit||!d.maksud)return alert('Lengkapi semua isian permintaan SPD.');
  d.lama=lamaHr(d.tglBerangkat,d.tglKembali);if(d.lama<1)return alert('Tanggal kembali tidak boleh sebelum tanggal berangkat.');
  await saveReq('spd',id,d,$('#f_spd_df').files[0])},
 async spdKirim(id){const x=S.spd[id];if(!x||x.status!='Draft'||!x.dukung)return alert('Lengkapi data dan unggah data dukung terlebih dahulu.');if(!confirm('Kirim permintaan SPD ini ke atasan?'))return;
  try{await setDoc(doc(db,'spd',id),{status:'Diajukan',sentAt:new Date().toISOString(),alasan:''},{merge:true})}catch(e){return alert('Gagal mengirim: '+e.message)}
  notif('spd_new','spd',id,'Permintaan SPD terkirim — beri tahu atasan',(x.atasanJab?konAtsJ(x):konAts(x.bagian)),`*Permintaan SPD baru*\nPengaju: ${S.me.nama} (NIP ${S.me.nip})\n${spdMsg(x)}\n\nKlik tautan berikut untuk membuka halaman persetujuan (masuk sebagai Admin Atasan):\n${lnk('spd',id)}`,'Permintaan SPD terkirim. Atasan sudah diberi tahu lewat WhatsApp.')},
 async spdDel(id){const x=S.spd[id];if(!x)return;const adm=isStAdm()&&!isPeg();if(!adm&&!['Draft','Ditolak','Diajukan'].includes(x.status))return alert('Permintaan yang sudah disetujui atasan hanya dapat dihapus oleh Admin STSPD.');
  if(!confirm((x.status=='Diajukan'?'Batalkan dan hapus':'Hapus')+' permintaan SPD ini'+(x.hasil?' beserta file SPD yang sudah diunggah':'')+'? Tindakan ini tidak dapat dibatalkan.'))return;

  alert('Permintaan SPD dihapus.')},
 // --- SPD: atasan ---

  notif('spd_ok','spd',id,'SPD disetujui — beri tahu Admin STSPD',konProc(x),`*Permintaan SPD disetujui atasan*\nPengaju: ${x.pegawai[0].nama}\n${spdMsg(x)}\nDisetujui oleh: ${S.me.nama}\n\nMohon segera diterbitkan SPD-nya di aplikasi SI-Tukin, menu SPD.`,'SPD disetujui. Admin STSPD sudah diberi tahu lewat WhatsApp.')},

 // --- SPD: admin STSPD ---
 spdUp(id){const x=S.spd[id];if(!x)return;dlg(`<h3>Unggah SPD</h3><p style="font-size:12px">${(x.pegawai||[]).map(p=>esc(p.nama)).join(', ')} — ${esc(x.tujuan)}</p><div class="f">${E(['spd_no','Nomor SPD','text'],{v:x.no,w:1})}<label class="w">File SPD (gambar/PDF ≤700KB)${x.hasil?'<br><small>File saat ini: '+esc(x.hasil)+'</small>':''}<input type="file" id="f_spd_hs" accept="image/*,application/pdf"></label></div><p><button class="b" onclick="F.spdUpS('${id}')">Simpan</button></p>`)},
 async spdUpS(id){const x=S.spd[id],file=$('#f_spd_hs').files[0],no=(f('spd_no')||'').trim();if(!x||!no)return alert('Isi nomor SPD.');if(!file&&!x.hasil)return alert('Pilih file SPD.');

   await setDoc(doc(db,'spd',id),{no,hasil:nm,status:'Selesai',stspdBy:S.me.nama,selesaiAt:new Date().toISOString()},{merge:true});$('#dlg').close()}catch(e){return alert('Gagal: '+e.message)}
