<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--navy:#0e2a47;--p:#1b5fa7;--gold:#c8a24a;--bg:#f3f5f8;--c:#fff;--t:#17202e;--m:#667085;--b:#e2e6ed;--h:#f8f9fb;--r:#b42318;--g:#12805c}

.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.br{display:flex;gap:10px;align-items:center;padding:4px 8px 18px;color:#fff}.br .em{width:36px;height:36px;border-radius:10px;background:var(--gold);color:var(--navy);display:grid;place-items:center}

.us{display:flex;gap:10px;align-items:center;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.12)}
.av{width:34px;height:34px;border-radius:50%;background:#2a4a70;color:#fff;display:grid;place-items:center;font-weight:600}.us div{flex:1;min-width:0;line-height:1.25}.us b{display:block;color:#fff;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.us small{font-size:11px;color:#93a8c2}
.us button{background:none;border:0;color:#cbd6e4;cursor:pointer;padding:6px;border-radius:6px}.us button:hover{background:rgba(255,255,255,.1)}
main{padding:24px 28px;min-width:0;max-width:1400px}.pt{font-size:22px;font-weight:700;margin:0 0 16px;display:flex;gap:10px;align-items:center}.pt .i{width:24px;height:24px;color:var(--p)}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:18px;margin-bottom:16px}
h3{margin:0 0 12px;font-size:15px;font-weight:600}.mu{color:var(--m)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{border-bottom:1px solid var(--b);padding:9px 10px;text-align:right;white-space:nowrap}th{background:var(--h);color:var(--m);font-weight:600}td.l,th.l{text-align:left;white-space:normal}
input,select,textarea{padding:8px 10px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);font:inherit;max-width:100%}
input:focus,select:focus{outline:2px solid var(--p);outline-offset:0;border-color:transparent}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.g label{display:flex;flex-direction:column;gap:4px;color:var(--m);font-size:12px;font-weight:500}
.m12{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.m12 input{width:100%}
button.b{background:var(--p);color:#fff;border:0;padding:9px 16px;border-radius:8px;cursor:pointer;font:inherit;font-weight:600}button.b:hover{filter:brightness(1.08)}button.s{background:var(--c);color:var(--t);border:1px solid var(--b)}
.n{display:flex;gap:10px;align-items:flex-start;background:#fff8e6;color:#6b4e00;border:1px solid #f0dca0;padding:10px 14px;margin-bottom:8px;border-radius:10px}.n .i{margin-top:2px;color:#b78103}
.tag{padding:2px 10px;border-radius:20px;background:var(--h);font-size:11.5px;font-weight:600}.tag.diajukan{background:#fff1d6;color:#8a5a00}.tag.dibayar{background:#dfeeff;color:#16508f}.tag.tercatat{background:#dcf5e9;color:#0c6847}
.bar{height:6px;background:var(--b);border-radius:4px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--g)}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.st>div{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:16px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center}
.st .i{grid-row:span 2;width:40px;height:40px;padding:10px;border-radius:10px;background:#e8f0fa;color:var(--p)}.st span{color:var(--m);font-size:12px}.st b{font-size:18px}
.neg{color:var(--r)}a{color:var(--p)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--h);padding:4px;border-radius:10px;border:1px solid var(--b)}
.seg button{display:flex;gap:6px;align-items:center;justify-content:center;padding:9px 6px;border:0;border-radius:7px;background:none;color:var(--m);font:inherit;font-weight:600;cursor:pointer}
.seg button.on{background:var(--c);color:var(--p);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lg{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}.lb{background:var(--navy);color:#cbd6e4;padding:8vh 8%;display:flex;flex-direction:column;justify-content:center;gap:14px}
.lb .em{width:56px;height:56px;border-radius:14px;background:var(--gold);color:var(--navy);display:grid;place-items:center}.lb .em .i{width:30px;height:30px}
.lb h1{margin:6px 0 0;color:#fff;font-size:34px}.lb p{margin:0;max-width:360px;font-size:15px}.lb ul{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px}.lb li{display:flex;gap:10px;align-items:center}.lb li .i{color:var(--gold)}
.lf{display:flex;flex-direction:column;justify-content:center;padding:6vh 10%;gap:12px;max-width:520px}.lf h2{margin:0;font-size:24px}.lf label{display:flex;flex-direction:column;gap:4px;color:var(--m);font-size:12px;font-weight:500}.lf input{padding:11px 12px}
@media(max-width:820px){.shell,.lg{grid-template-columns:1fr}aside{position:static;height:auto;padding:10px}aside nav{flex-direction:row;overflow-x:auto}aside nav button{white-space:nowrap}.br{padding-bottom:8px}.us{border:0;padding-top:8px}
main{padding:16px}.m12{grid-template-columns:repeat(3,1fr)}.lb{padding:6vh 8%}.lf{padding:5vh 8%}}

<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,addDoc,getDoc,updateDoc,writeBatch,onSnapshot,query,where,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ====== ISI DENGAN KONFIGURASI FIREBASE ANDA (Project settings > Your apps > Web) ======
const firebaseConfig={apiKey:"AIzaSyDPrFOqEUKagrftLk4-4gZsb4eQQy96xb8",authDomain:"sirenku-e03be.firebaseapp.com",projectId:"sirenku-e03be",messagingSenderId:"410952267113",appId:"1:410952267113:web:3fa5318453657833e3b9f8"};
// =======================================================================================

const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb);
const BLN=["JAN","FEB","MAR","APR","MEI","JUN","JUL","AGS","SEP","OKT","NOV","DES"],JENIS=["GU","UP","TUP","TU","LS"];
const ROLES={super_admin:"Super Admin",atasan:"Atasan / Pimpinan",perencana:"Admin Perencana",admin_tf:"Admin TF",admin_catat:"Admin Catat",pegawai:"Pegawai"};
let portal="pegawai",imp=null,fSat="",fLv=0,me=null,tab="dash",U=[],K=[],KEU={},P=[],S={},unsubs=[],editId=null,err="";
const $=id=>document.getElementById(id),rp=n=>"Rp "+Math.round(n||0).toLocaleString("id-ID"),num=v=>+v||0;
const sum=a=>(a||[]).reduce((x,y)=>x+num(y),0),tw=(a,t)=>sum((a||[]).slice(t*3,t*3+3));
const PORTAL={pegawai:{t:"Pegawai",i:"user",r:["pegawai","perencana","admin_tf","admin_catat"],d:"Untuk pegawai, Admin Perencana, Admin TF, dan Admin Catat."},
 atasan:{t:"Atasan",i:"briefcase",r:["atasan"],d:"Untuk atasan dan pimpinan: memantau capaian dan SPJ bawahan."},
 super_admin:{t:"Super Admin",i:"shield",r:["super_admin"],d:"Untuk pengelola sistem: mengatur pengguna dan hak akses."}};
const LV=["Program","Kegiatan","KRO","RO","Komponen","Sub Komponen","Akun Belanja","Detail"],JAB=["","Kabag Administrasi","Kabag P3SPH","Kabag Pengawasan & Humas","Kasubbag","Ketua Komisioner","Anggota Komisioner"];
const isR=(...r)=>r.includes(me?.role),isP=()=>me?.role==="pegawai";
const nm=uid=>U.find(u=>u.id===uid)?.nama||"-";

let KP={},PP={};
const rebuild=()=>{KEU={};Object.values(KP).flat().forEach(d=>KEU[d.id]=d);P=Object.values(PP).flat()};
const feed=(st,id,q)=>unsubs.push(onSnapshot(q,x=>{st[id]=x.docs.map(d=>({id:d.id,...d.data()}));rebuild();render()},e=>{err=e.message;render()}));
onAuthStateChanged(auth,u=>{unsubs.forEach(f=>f());unsubs=[];KP={};PP={};KEU={};P=[];if(!u){me=null;return render()}
 const sub=(q,fn)=>unsubs.push(onSnapshot(q,x=>{fn(x);render()},e=>{err=e.message;render()}));
 sub(collection(db,"users"),x=>{U=x.docs.map(d=>({id:d.id,...d.data()}));me=U.find(y=>y.id===u.uid)||null});
 sub(collection(db,"komponen"),x=>K=x.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.kode||"").localeCompare(b.kode||"")));
 let done=false;const w=setInterval(()=>{if(!me||done)return;done=true;clearInterval(w);setup(u.uid)},300);unsubs.push(()=>clearInterval(w));
});
// data keuangan dimuat sesuai peran: penuh / atasan (* atau per kunci) / pegawai (milik sendiri)
function setup(uid){const full=isR("super_admin","perencana","admin_tf","admin_catat"),lk=me.lingkup||[],all=full||(me.role==="atasan"&&lk.includes("*"));
 if(all){feed(PP,"all",collection(db,"pengajuan"));feed(KP,"all",collection(db,"keu"));
  unsubs.push(onSnapshot(collection(db,"saldo"),x=>{S={};x.docs.forEach(d=>S[d.id]=d.data());render()},()=>{}))}
 else if(me.role==="atasan")lk.forEach(k=>{feed(PP,k,query(collection(db,"pengajuan"),where("kunci","==",k)));feed(KP,k,query(collection(db,"keu"),where("kunci","==",k)))});
 else feed(PP,"me",query(collection(db,"pengajuan"),where("pengaju","==",uid)))}

// ---------- perhitungan ----------
const real=k=>{const a=Array(12).fill(0);P.filter(p=>p.komponenId===k&&p.status==="tercatat").forEach(p=>a[new Date(p.tglBayar).getMonth()]+=num(p.jumlah));return a};
const terpakai=j=>P.filter(p=>p.status==="tercatat"&&p.jenis===j&&p.ke==S[j]?.ke).reduce((a,p)=>a+num(p.jumlah),0);
const umur=p=>p.tglBayar?(Date.now()-new Date(p.tglBayar))/864e5:0;
const telat=uid=>P.some(p=>p.pengaju===uid&&["dibayar","tercatat"].includes(p.status)&&!p.spjId&&umur(p)>=7);
function notifs(){const n=[];
 P.forEach(p=>{if(["dibayar","tercatat"].includes(p.status)&&!p.spjId){const a=umur(p);
  if(p.pengaju===me.id)n.push(`Upload bukti SPJ "${p.uraian}" (sisa ${Math.max(0,7-Math.floor(a))} hari)${a>=7?" — TERLAMBAT: atasan telah diberi tahu & pengajuan berikutnya Anda terhambat":""}`);
  if(a>=7&&p.atasan===me.id)n.push(`${p.nama} belum upload SPJ "${p.uraian}" lebih dari 1 minggu; ini menghambat pengajuan GU/UP/TUP/TU/LS berikutnya`)}});
 if(isR("super_admin","admin_catat","admin_tf"))JENIS.forEach(j=>{const s=S[j];if(s?.limit&&(s.limit-terpakai(j))/s.limit<.2)n.push(`Saldo ${j} ke-${s.ke} menipis (sisa ${rp(s.limit-terpakai(j))}). Ajukan ${j} berikutnya.`)});
 if(isR("super_admin","perencana"))K.forEach(k=>{const pg=KEU[k.id]?.pagu;if(pg&&sum(real(k.id))/pg>=.75&&!k.reqSent)n.push(`Realisasi komponen ${k.kode} ≥75%. Kirim permintaan input capaian output di tab Output.`)});
 K.filter(k=>k.pj===me.id&&k.reqSent&&!k.outputId&&!k.kendala).forEach(k=>n.push(`Mohon input realisasi output & upload bukti untuk komponen ${k.kode}, atau isi kendala + target penyelesaian.`));
 return n}

// ---------- tampilan ----------
const ICN={dash:"dash",ajukan:"file",bayar:"wallet",catat:"book",komp:"layers",output:"target",user:"users",pantau:"eye"};
const ic=n=>`<svg class="i" viewBox="0 0 24 24"><use href="#i-${n}"/></svg>`;
function render(){const a=$("app");
 if(!auth.currentUser){const pt=PORTAL[portal];return a.innerHTML=`<div class="lg"><div class="lb"><div class="em">${ic("landmark")}</div><h1>SIRENKU</h1><p>Sistem Informasi Perencanaan dan Keuangan Terpadu</p>
 <ul><li>${ic("layers")}Perencanaan dan pagu anggaran</li><li>${ic("wallet")}Pembayaran dan bukti SPJ</li><li>${ic("target")}Capaian output kegiatan</li></ul></div>
 <div class="lf"><h2>Masuk ke SIRENKU</h2><div class="seg">${Object.entries(PORTAL).map(([k,v])=>`<button class="${k===portal?"on":""}" onclick="A.portal('${k}')">${ic(v.i)}${v.t}</button>`).join("")}</div><span class="mu">${pt.d}</span>
 ${portal==="pegawai"?`<label>Nama (khusus pendaftaran)<input id="nm" autocomplete="name"></label>`:""}
 <label>Email<input id="em" type="email" autocomplete="username"></label><label>Password<input id="pw" type="password" autocomplete="current-password"></label>
 <div style="display:flex;gap:8px"><button class="b" onclick="A.login()">Masuk sebagai ${pt.t}</button>${portal==="pegawai"?`<button class="b s" onclick="A.reg()">Daftar</button>`:""}</div><div class="neg">${err}</div></div></div>`}
 if(!me)return a.innerHTML=`<main><div class="card">Memuat profil… Jika terlalu lama, profil belum dibuat. <button class="b s" onclick="A.out()">Keluar</button><div class="neg">${err}</div></div></main>`;
 const tabs=[["dash","Dashboard",!isP()],["ajukan","Pengajuan",!isR("atasan")],["bayar","Pembayaran",isR("admin_tf","super_admin")],["catat","Pencatatan & Saldo",isR("admin_catat","super_admin")],
  ["komp","Komponen & Pagu",isR("perencana","super_admin")],["output","Output",!isR("atasan")],["pantau","Pantau SPJ",isR("atasan","super_admin")],["user","Pengguna",isR("super_admin")]].filter(t=>t[2]);
 if(!tabs.find(t=>t[0]===tab))tab=tabs[0][0];
 const nf=notifs(),cur=tabs.find(t=>t[0]===tab);
 a.innerHTML=`<div class="shell"><aside><div class="br"><div class="em">${ic("landmark")}</div><div><b>SIRENKU</b><small>Perencanaan & Keuangan</small></div></div>
 <nav>${tabs.map(t=>`<button class="${t[0]===tab?"on":""}" onclick="A.go('${t[0]}')">${ic(ICN[t[0]])}${t[1]}</button>`).join("")}</nav>
 <div class="us"><span class="av">${(me.nama||"?")[0].toUpperCase()}</span><div><b>${me.nama}</b><small>${me.jabatan||ROLES[me.role]}</small></div><button title="Keluar" onclick="A.out()">${ic("out")}</button></div></aside>
 <main><h1 class="pt">${ic(ICN[tab])}${cur[1]}</h1>${nf.map(x=>`<div class="n">${ic("bell")}<span>${x}</span></div>`).join("")}<div class="neg">${err}</div>${V[tab]()}</main></div>`}

const V={
dash(){const rows0=K.filter(k=>KEU[k.id]&&(!fSat||k.satker===fSat)),sats=[...new Set(K.filter(k=>KEU[k.id]).map(k=>k.satker||"-"))].sort(),R={};rows0.forEach(k=>R[k.id]=sum(real(k.id)));
 const nodes=[],nm=(r,i)=>[r.program,r.kegiatan,r.kro,r.ro,((r.kode||"")+" "+(r.uraian||"")).trim(),r.subkomp,r.akun,r.detail][i]||"(belum diisi)";
 const walk=(rs,lv)=>{if(lv>fLv)return;const g={};rs.forEach(r=>(g[nm(r,lv)]=g[nm(r,lv)]||[]).push(r));
  Object.keys(g).sort().forEach(n=>{const x=g[n];nodes.push({lv,n,p:sum(x.map(r=>KEU[r.id].pagu)),e:sum(x.map(r=>R[r.id]))});walk(x,lv+1)})};walk(rows0,0);
 const tot={p:0,r:0};
 const rows=rows0.map(k=>{const pg=KEU[k.id]?.pagu||0,pl=KEU[k.id]?.rencana||[],rl=real(k.id),R=sum(rl);tot.p+=pg;tot.r+=R;
  const T=[0,1,2,3];return `<tr><td class="l">${k.kode}</td><td class="l">${k.uraian}<br><small style="color:var(--m)">${k.program||""} / ${k.kegiatan||""} / KRO ${k.kro||""} / RO ${k.ro||""}</small></td><td>${rp(pg)}</td>
  <td class="l">${k.indikator||""} (${k.target||""} ${k.satuan||""})</td>${T.map(t=>`<td>${rp(tw(pl,t))}</td>`).join("")}${T.map(t=>`<td>${rp(tw(rl,t))}</td>`).join("")}

  if(!PORTAL[portal].r.includes(r)){await signOut(auth);const k=Object.keys(PORTAL).find(k=>PORTAL[k].r.includes(r));
   throw Error(k?`Akun ini terdaftar sebagai ${ROLES[r]}. Silakan masuk lewat tab ${PORTAL[k].t}.`:"Profil akun tidak ditemukan.")}}),
 reg:run(async()=>{if(portal!=="pegawai")throw Error("Pendaftaran hanya lewat tab Pegawai");const nama=$("nm").value||$("em").value,c=await createUserWithEmailAndPassword(auth,$("em").value,$("pw").value);
  await setDoc(doc(db,"users",c.user.uid),{nama,email:$("em").value,role:"pegawai",atasan:""})}),
 out:()=>signOut(auth),
 ajukan:run(async()=>{if(telat(me.id))throw Error("Upload SPJ yang tertunggak dahulu");const j=num($("pj").value);if(!j||!$("pk").value)throw Error("Lengkapi data");
  await addDoc(collection(db,"pengajuan"),{komponenId:$("pk").value,kunci:(K.find(k=>k.id===$("pk").value)||{}).kunci||"",jumlah:j,uraian:$("pu").value,pengaju:me.id,nama:me.nama,atasan:me.atasan||"",status:"diajukan",dibuat:serverTimestamp()})}),
 bayar:run(id=>updateDoc(doc(db,"pengajuan",id),{status:"dibayar",tglBayar:$("t"+id).value})),
 catat:run(id=>updateDoc(doc(db,"pengajuan",id),{status:"tercatat",jenis:$("j"+id).value,ke:num($("e"+id).value)})),
 saldo:run(j=>setDoc(doc(db,"saldo",j),{limit:num($("sl"+j).value),ke:num($("sk"+j).value)})),
 spj:run(async id=>{const f=$("f"+id).files[0];if(!f)throw Error("Pilih file bukti SPJ");await updateDoc(doc(db,"pengajuan",id),{spjId:await up("spj",id,f),spjAt:new Date().toISOString()})}),
 simpanK:run(async()=>{const g=i=>$("k_"+i).value,a=p=>BLN.map((_,i)=>num($(p+i).value));
  const d={satker:g("satker").trim().toUpperCase(),bagian:g("bagian").trim().toUpperCase(),subkomp:g("subkomp"),akun:g("akun"),detail:g("detail"),kunci:g("satker").trim().toUpperCase()+"|"+g("bagian").trim().toUpperCase(),program:g("program"),kegiatan:g("kegiatan"),kro:g("kro"),ro:g("ro"),kode:g("kode"),uraian:g("uraian"),indikator:g("indikator"),satuan:g("satuan"),target:g("target"),pj:g("pj"),rencanaOutput:a("ro")};
  if(!d.satker||!d.bagian)throw Error("Isi Satker dan Bagian penanggung jawab");let id=editId;if(id)await updateDoc(doc(db,"komponen",id),d);else id=(await addDoc(collection(db,"komponen"),{...d,realOutput:[]})).id;
  await setDoc(doc(db,"keu",id),{kunci:d.kunci,pagu:num(g("pagu")),rencana:a("rp"),revisiOleh:me.id,revisiAt:new Date().toISOString()});editId=null}),
 req:run(id=>updateDoc(doc(db,"komponen",id),{reqSent:true})),
 out2:run(async id=>{const d={realOutput:BLN.map((_,i)=>num($(`ro_${id}_${i}`).value)),kendala:$("kd_"+id).value,targetSelesai:$("ts_"+id).value};
  const f=$("of_"+id).files[0];if(f)d.outputId=await up("output",id,f);
  if(!f&&!K.find(k=>k.id===id).outputId&&(!d.kendala||!d.targetSelesai))throw Error("Belum ada bukti output: isi kendala dan target penyelesaian");
  await updateDoc(doc(db,"komponen",id),d)}),
 user:run(id=>updateDoc(doc(db,"users",id),{role:$("r"+id).value,jabatan:$("j"+id).value,satker:$("s"+id).value.trim().toUpperCase(),atasan:$("a"+id).value,lingkup:$("l"+id).value.split(",").map(x=>x.trim().toUpperCase()).filter(Boolean)}))
};
render();
